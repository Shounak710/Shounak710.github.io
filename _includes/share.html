<div class="share-bar" data-share
     data-title="{{ include.title | default: page.title | escape }}"
     data-url="{{ site.url }}{{ site.baseurl }}{{ include.url | default: page.url }}"
     data-excerpt="{{ include.excerpt | default: page.excerpt | strip_html | truncate: 180 | escape }}">
  <span class="share-label">Share</span>
  <button type="button" class="share-btn" data-share-linkedin>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4.98 3.5C4.98 4.88 3.88 6 2.5 6S0 4.88 0 3.5 1.12 1 2.5 1s2.48 1.12 2.48 2.5zM.24 8.1h4.52V24H.24V8.1zM8.1 8.1h4.33v2.16h.06c.6-1.14 2.08-2.35 4.28-2.35 4.58 0 5.43 3.01 5.43 6.93V24h-4.52v-7.93c0-1.89-.03-4.32-2.63-4.32-2.63 0-3.04 2.06-3.04 4.18V24H8.1V8.1z"/></svg>
    LinkedIn
  </button>
  <button type="button" class="share-btn" data-share-substack>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M22.5 4.2H1.5v2.4h21V4.2zm0 13.2H1.5V22l10.5-3.3L22.5 22v-4.6zM1.5 8.4h21v7.2h-21V8.4z"/></svg>
    Substack
  </button>
  <button type="button" class="share-btn" data-share-copy>Copy link</button>
</div>
