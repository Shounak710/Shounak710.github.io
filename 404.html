<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Not found — Shounak Kulkarni</title>
  <script>
    (function () {
      var theme = null;
      try { theme = localStorage.getItem("sk-theme"); } catch (e) {}
      if (theme !== "light" && theme !== "dark") {
        theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@300;400;500&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="/">
        <span class="brand-mark">SK</span>
        Shounak Kulkarni
      </a>
      <nav class="nav">
        <a href="/">Home</a>
        <a href="/blog/">Blog</a>
        <button class="theme-toggle" type="button" data-theme-toggle>
          <span data-theme-label>Dark</span>
        </button>
      </nav>
    </div>
  </header>
  <main class="site-main wrap">
    <header class="page-head">
      <p class="kicker">404</p>
      <h1>This page is not here.</h1>
      <p class="muted">Try the <a href="/">home page</a> or the <a href="/blog/">blog</a>.</p>
    </header>
  </main>
  <script src="/js/core.js"></script>
</body>
</html>
