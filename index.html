<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shounak Kulkarni</title>
  <meta name="description" content="Notes on building — code, campus, and the rest.">
  <script>
    (function () {
      var theme = null;
      try { theme = localStorage.getItem("sk-theme"); } catch (e) {}
      if (theme !== "light" && theme !== "dark") {
        theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="/">Shounak Kulkarni</a>
      <nav class="nav">
        <a class="is-active" href="/">Home</a>
        <a href="/blog/">Blog</a>
        <button class="theme-toggle" type="button" data-theme-toggle>
          <span data-theme-label>Dark</span>
        </button>
      </nav>
    </div>
  </header>

  <main id="main" class="site-main">
    <section class="wrap hero">
      <p class="kicker">IIT Bombay · Civil Engineering</p>
      <h1>Shounak Kulkarni</h1>
      <p class="hero-copy">Notes on code, campus, and things worth keeping.</p>
      <div class="actions">
        <a class="btn" href="/blog/">Read the blog</a>
        <a class="btn btn-ghost" href="https://github.com/Shounak710">GitHub</a>
      </div>
    </section>

    <section class="wrap section">
      <div class="section-head">
        <h2>Latest</h2>
        <a href="/blog/">All posts</a>
      </div>
      <div class="post-list" data-home-list>
        <p class="muted">Loading…</p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-row">
      <span>© <span data-year></span> Shounak Kulkarni</span>
      <a href="https://github.com/Shounak710">GitHub</a>
    </div>
  </footer>

  <script src="/js/config.js"></script>
  <script src="/js/core.js"></script>
  <script src="/js/home.js"></script>
</body>
</html>
