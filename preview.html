---
layout: default
title: Preview
permalink: /preview/
---

<article class="article-page" data-local-preview>
  <p class="eyebrow">Local note</p>
  <h1 data-preview-title>Untitled</h1>
  <div class="article-meta">
    <time data-preview-date></time>
    <span class="badge">Saved in this browser</span>
    <span data-preview-tags></span>
  </div>
  <div class="article-body" data-preview-body></div>
  <div class="share-bar">
    <a class="btn btn-ghost" data-edit-link href="{{ site.baseurl }}/write/">Edit</a>
    <button type="button" class="share-btn" data-share-linkedin>LinkedIn</button>
    <button type="button" class="share-btn" data-share-substack>Substack</button>
  </div>
</article>
