---
layout: default
---

<article class="article-page">
  <p class="eyebrow">Notebook</p>
  <h1>{{ page.title }}</h1>
  <div class="article-meta">
    <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    {% if page.tags %}
      {% for tag in page.tags %}
        <span class="tag">{{ tag }}</span>
      {% endfor %}
    {% endif %}
  </div>
  <div class="article-body entry">
    {{ content }}
  </div>
  {% include share.html %}
  {% include disqus.html %}
</article>
