<!DOCTYPE html>
<html lang="en">
  <head>
    <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.name }}</title>
    {% include meta.html %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="{{ site.baseurl }}/style.css" />
    <link rel="alternate" type="application/rss+xml" title="{{ site.name }} - {{ site.description }}" href="{{ site.baseurl }}/feed.xml" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="site-shell">
      <header class="site-header">
        <div class="container header-inner">
          <a class="brand" href="{{ site.baseurl }}/">
            <span class="brand-mark">{{ site.name | slice: 0 }}</span>
            <span class="brand-text">
              <span class="brand-name">{{ site.name }}</span>
              <span class="brand-tag">{{ site.description }}</span>
            </span>
          </a>
          <nav class="site-nav" aria-label="Primary">
            <a href="{{ site.baseurl }}/" {% if page.url == '/' %}class="is-active"{% endif %}>Home</a>
            <a href="{{ site.baseurl }}/posts/" {% if page.url == '/posts/' %}class="is-active"{% endif %}>Posts</a>
            <a href="{{ site.baseurl }}/about/" {% if page.url == '/about/' %}class="is-active"{% endif %}>About</a>
            <a class="nav-write" href="{{ site.baseurl }}/write/">New post</a>
          </nav>
        </div>
      </header>

      <main id="main" class="site-main">
        <div class="container">
          {{ content }}
        </div>
      </main>

      <footer class="site-footer">
        <div class="container footer-inner">
          <p>© {{ site.time | date: '%Y' }} {{ site.name }}. Notes from campus and a laptop.</p>
          <div class="footer-links">
            {% include svg-icons.html %}
          </div>
        </div>
      </footer>
    </div>

    <div class="toast" data-toast hidden></div>
    <script>
      window.BLOG = {
        name: {{ site.name | jsonify }},
        url: {{ site.url | jsonify }},
        baseurl: {{ site.baseurl | jsonify }},
        githubRepo: {{ site.github_repo | jsonify }},
        githubBranch: {{ site.github_branch | jsonify }}
      };
    </script>
    <script src="{{ site.baseurl }}/assets/js/blog.js"></script>
    {% include analytics.html %}
  </body>
</html>
