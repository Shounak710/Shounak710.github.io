<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Post — Shounak Kulkarni</title>
  <script>
    (function () {
      var theme = null;
      try { theme = localStorage.getItem("sk-theme"); } catch (e) {}
      if (theme !== "light" && theme !== "dark") {
        theme = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      }
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@300;400;500&family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="brand" href="/">
        <span class="brand-mark">SK</span>
        Shounak Kulkarni
      </a>
      <nav class="nav">
        <a href="/">Home</a>
        <a href="/blog/">Blog</a>
        <button class="theme-toggle" type="button" data-theme-toggle>
          <span data-theme-label>Dark</span>
        </button>
      </nav>
    </div>
  </header>

  <main id="main" class="site-main wrap">
    <article class="article" data-article>
      <p class="kicker" data-kicker>Post</p>
      <h1 data-title>Loading…</h1>
      <p class="mono" data-date></p>
      <div class="meta-row" data-tags style="margin: 1rem 0 1.8rem;"></div>
      <div class="article-body" data-body></div>
    </article>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-row">
      <span>© <span data-year></span> Shounak Kulkarni</span>
      <a href="/blog/">Back to blog</a>
    </div>
  </footer>

  <script src="/js/config.js"></script>
  <script src="/js/core.js"></script>
  <script src="/js/post.js"></script>
</body>
</html>
